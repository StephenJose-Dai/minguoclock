name: Build APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # 可选：在仓库 Settings → Secrets 里配置 KEYSTORE_BASE64 等，就用你自己的签名；没配置则用仓库自带的 keystore/minguo.jks
      - name: Prepare signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "使用 Secrets 中的签名密钥"
          else
            echo "使用仓库自带的 keystore/minguo.jks"
          fi

      - name: Build release + debug APKs
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease assembleDebug --stacktrace

      - name: Rename APKs
        id: dist
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          for f in app/build/outputs/apk/*/*.apk; do
            name=$(basename "$f" .apk)        # 例如 app-arm64-v8a-release
            type=${name##*-}                   # release / debug
            abi=${name#app-}; abi=${abi%-$type} # arm64-v8a / universal
            cp "$f" "dist/MinguoClock-v${VERSION}-${abi}-${type}.apk"
          done
          ls -la dist
          {
            echo "## 民国纪年 v${VERSION}"
            echo ""
            echo "| 文件 | 大小 |"
            echo "|---|---|"
            for f in dist/*.apk; do echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"; done
            echo ""
            echo "- **不知道选哪个：下载 universal-release**（所有手机通用）"
            echo "- 2017 年以后的手机：arm64-v8a-release；老的 32 位手机：armeabi-v7a-release；电脑模拟器：x86_64 / x86"
            echo "- *-debug：调试版，独立安装，用于排查问题"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: MinguoClock-v${{ steps.dist.outputs.version }}-release
          path: dist/*-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MinguoClock-v${{ steps.dist.outputs.version }}-debug
          path: dist/*-debug.apk

      # 推送 v 开头的 tag（如 v3.2.0）时自动发布 Release
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
